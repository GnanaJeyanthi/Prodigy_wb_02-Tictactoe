<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Tic-Tac-Toe</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Modern Tic-Tac-Toe</h1>
            <p>Play against AI or challenge a friend</p>
        </header>
        
        <div class="game-area">
            <div class="game-board" id="board">
                <!-- Cells will be generated by JavaScript -->
            </div>
            
            <div class="controls">
                <div class="player-config">
                    <h3>Player 1</h3>
                    <p>Choose your marker:</p>
                    <div class="marker-selector" id="player1-markers">
                        <div class="marker-option selected" data-marker="X">X</div>
                        <div class="marker-option" data-marker="O">O</div>
                        <div class="marker-option" data-marker="★">★</div>
                        <div class="marker-option" data-marker="♥">♥</div>
                    </div>
                </div>
                
                <div class="player-config">
                    <h3>Player 2 / AI</h3>
                    <p>Choose opponent:</p>
                    <div class="button-group">
                        <button id="ai-opponent" class="selected">AI</button>
                        <button id="human-opponent">Human</button>
                    </div>
                    
                    <div class="difficulty-selector" id="difficulty-container">
                        <p>AI Difficulty:</p>
                        <div class="button-group">
                            <button class="difficulty-btn" data-level="easy">Easy</button>
                            <button class="difficulty-btn selected" data-level="medium">Medium</button>
                            <button class="difficulty-btn" data-level="hard">Hard</button>
                        </div>
                    </div>
                    
                    <p class="marker-label">Marker:</p>
                    <div class="marker-selector" id="player2-markers">
                        <div class="marker-option" data-marker="X">X</div>
                        <div class="marker-option selected" data-marker="O">O</div>
                        <div class="marker-option" data-marker="★">★</div>
                        <div class="marker-option" data-marker="♥">♥</div>
                    </div>
                </div>
                
                <div class="game-controls">
                    <button id="new-game">New Game</button>
                    <button id="reset-stats" class="reset">Reset Stats</button>
                </div>
                
                <div class="status" id="status">
                    Ready to play!
                </div>
                
                <div class="stats-container">
                    <h3>Game Statistics</h3>
                    <div class="stats">
                        <div class="stat-card">
                            <div>Player 1</div>
                            <div class="stat-value" id="player1-wins">0</div>
                        </div>
                        <div class="stat-card">
                            <div>Draws</div>
                            <div class="stat-value" id="draws">0</div>
                        </div>
                        <div class="stat-card">
                            <div>Player 2</div>
                            <div class="stat-value" id="player2-wins">0</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <div class="modal" id="result-modal">
        <div class="modal-content">
            <h2>Game Over</h2>
            <div class="result-message" id="result-message"></div>
            <button id="play-again">Play Again</button>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
